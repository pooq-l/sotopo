<!DOCTYPE html>
<html lang="ja">
<head>
  <!-- ファビコン（ブラウザタブ用） -->
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<!-- iOSのホーム画面追加用 -->
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">

<!-- Android/PWA用（マニフェスト経由） -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3F6E64">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>そとポ — 今日の一歩</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F1EEE6;
    --bg-soft: #E8E3D6;
    --ink: #23291F;
    --ink-soft: #5B6154;
    --card: #FFFFFF;
    --line: #DAD4C4;
    --sun: #E8A33D;
    --sun-soft: #FBE6C3;
    --teal: #3F6E64;
    --teal-soft: #DCE9E5;
    --coral: #E8735C;
    --coral-soft: #FBDFD9;
    --violet: #8467B0;
    --violet-soft: #E7E0F2;
    --shadow: rgba(35, 41, 31, 0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1B1D18; --bg-soft: #22251E; --ink: #EDEAE0; --ink-soft: #A7AC9C;
      --card: #262922; --line: #383C31; --sun: #F0B457; --sun-soft: #3A331F;
      --teal: #7FB3A6; --teal-soft: #223530; --coral: #F0917C; --coral-soft: #3A2620;
      --violet: #B6A3DE; --violet-soft: #2E2A3C; --shadow: rgba(0, 0, 0, 0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1B1D18; --bg-soft: #22251E; --ink: #EDEAE0; --ink-soft: #A7AC9C;
    --card: #262922; --line: #383C31; --sun: #F0B457; --sun-soft: #3A331F;
    --teal: #7FB3A6; --teal-soft: #223530; --coral: #F0917C; --coral-soft: #3A2620;
    --violet: #B6A3DE; --violet-soft: #2E2A3C; --shadow: rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: "Noto Sans JP", sans-serif; -webkit-font-smoothing: antialiased; }
  body { min-height: 100vh; display: flex; justify-content: center; padding: 28px 16px 64px; position: relative; }
  .app { width: 100%; max-width: 460px; }
  h1, h2, h3, .brand { font-family: "Zen Maru Gothic", "Noto Sans JP", sans-serif; }

  header.top { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 18px; }
  .brand { font-size: 22px; font-weight: 700; letter-spacing: 0.02em; }
  .brand span { color: var(--sun); }
  .date-label { font-size: 13px; color: var(--ink-soft); }

  .hero { background: linear-gradient(180deg, var(--sun-soft), var(--bg-soft)); border: 1px solid var(--line); border-radius: 22px; padding: 22px 20px 18px; margin-bottom: 16px; position: relative; overflow: hidden; }
  .hero-top { display: flex; align-items: center; gap: 16px; }
  .door-wrap { width: 74px; height: 92px; flex-shrink: 0; }
  .hero-text { flex: 1; min-width: 0; }
  .streak-num { font-size: 34px; font-weight: 700; line-height: 1.1; font-family: "Zen Maru Gothic", sans-serif; }
  .streak-num small { font-size: 15px; font-weight: 500; color: var(--ink-soft); margin-left: 4px; }
  .hero-sub { font-size: 13px; color: var(--ink-soft); margin-top: 4px; line-height: 1.5; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px; margin-bottom: 14px; box-shadow: 0 1px 2px var(--shadow); }
  .card h2 { font-size: 16px; margin: 0 0 10px; font-weight: 700; }
  .card h2 .sub { font-size: 12px; font-weight: 500; color: var(--ink-soft); }

  .choice-list { display: flex; flex-direction: column; gap: 10px; }
  .choice { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--bg-soft); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; cursor: pointer; color: var(--ink); font-family: inherit; font-size: 14px; transition: transform 0.12s ease, background 0.12s ease; }
  .choice:hover { background: var(--teal-soft); }
  .choice:active { transform: scale(0.98); }
  .choice-icon { font-size: 22px; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; background: var(--card); border-radius: 10px; flex-shrink: 0; }
  .choice-body { flex: 1; min-width: 0; }
  .choice-title { font-weight: 500; }
  .choice-meta { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .choice-pt { font-size: 13px; font-weight: 700; color: var(--sun); white-space: nowrap; }

  .in-progress { text-align: center; padding: 8px 4px 4px; }
  .timer-ring { width: 120px; height: 120px; margin: 4px auto 14px; border-radius: 50%; background: conic-gradient(var(--teal) calc(var(--pct, 0) * 1%), var(--teal-soft) 0); display: flex; align-items: center; justify-content: center; transition: background 0.4s ease; }
  .timer-inner { width: 96px; height: 96px; border-radius: 50%; background: var(--card); display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .timer-inner .t { font-size: 20px; font-weight: 700; font-family: "Zen Maru Gothic", sans-serif; }
  .timer-inner .u { font-size: 11px; color: var(--ink-soft); }
  .in-progress p { font-size: 13px; color: var(--ink-soft); margin: 0 0 16px; line-height: 1.6; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: none; border-radius: 999px; padding: 13px 22px; font-size: 15px; font-weight: 700; font-family: "Zen Maru Gothic", sans-serif; cursor: pointer; transition: transform 0.12s ease, opacity 0.12s ease; }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--teal); color: #fff; width: 100%; }
  .btn-ghost { background: transparent; color: var(--ink-soft); border: 1px solid var(--line); font-size: 13px; padding: 9px 16px; }
  .btn-coral { background: var(--coral); color: #fff; width: 100%; }
  .btn-violet { background: var(--violet); color: #fff; width: 100%; }
  .btn-text { background: none; border: none; color: var(--ink-soft); font-size: 13px; text-decoration: underline; cursor: pointer; font-family: inherit; padding: 6px; }

  .done-state { text-align: center; padding: 10px 4px 6px; }
  .done-state .big { font-size: 44px; line-height: 1; margin-bottom: 8px; }
  .done-state h3 { margin: 0 0 6px; font-size: 17px; }
  .done-state p { font-size: 13px; color: var(--ink-soft); margin: 0 0 16px; line-height: 1.6; }
  .pt-pop { color: var(--sun); font-weight: 700; }
  .pt-breakdown { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 0 0 16px; }
  .pt-chip { font-size: 12px; background: var(--bg-soft); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; color: var(--ink-soft); }
  .pt-chip b { color: var(--sun); }

  .find-grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
  .find-opt { display: flex; align-items: center; gap: 10px; background: var(--bg-soft); border: 1px solid var(--line); border-radius: 14px; padding: 11px 14px; cursor: pointer; font-family: inherit; font-size: 14px; color: var(--ink); text-align: left; }
  .find-opt:active { transform: scale(0.98); }
  .find-opt .ic { font-size: 20px; }
  .find-opt.found-before { opacity: 0.55; }
  .find-opt .tag { margin-left: auto; font-size: 11px; color: var(--ink-soft); }

  .mood-row { display: flex; justify-content: space-between; gap: 6px; margin: 14px 0 16px; }
  .mood-opt { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; background: var(--bg-soft); border: 1px solid var(--line); border-radius: 14px; padding: 10px 2px; cursor: pointer; font-family: inherit; }
  .mood-opt .e { font-size: 22px; }
  .mood-opt .l { font-size: 10px; color: var(--ink-soft); }
  .mood-opt.picked { background: var(--teal-soft); border-color: var(--teal); }

  .level-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .level-name { font-weight: 700; font-size: 15px; }
  .level-pt { font-size: 13px; color: var(--ink-soft); }
  .bar-track { width: 100%; height: 8px; background: var(--bg-soft); border-radius: 999px; overflow: hidden; }
  .bar-fill { height: 100%; background: linear-gradient(90deg, var(--sun), var(--coral)); border-radius: 999px; transition: width 0.5s ease; }
  .level-next { font-size: 12px; color: var(--ink-soft); margin-top: 6px; }

  .week-strip { display: flex; justify-content: space-between; gap: 6px; }
  .week-day { flex: 1; text-align: center; }
  .week-day .dot { width: 30px; height: 30px; margin: 0 auto 6px; border-radius: 50%; background: var(--bg-soft); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 13px; }
  .week-day .dot.on { background: var(--coral-soft); border-color: var(--coral); }
  .week-day .lbl { font-size: 11px; color: var(--ink-soft); }
  .week-day.today .lbl { color: var(--ink); font-weight: 700; }

  .zukan-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .zukan-cell { aspect-ratio: 1; border-radius: 12px; background: var(--bg-soft); border: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .zukan-cell.filled { background: var(--violet-soft); border-color: var(--violet); }
  .zukan-cell .ic { font-size: 18px; opacity: 0.3; }
  .zukan-cell.filled .ic { opacity: 1; }
  .zukan-cell .nm { font-size: 9px; color: var(--ink-soft); text-align: center; line-height: 1.2; padding: 0 2px; }
  .zukan-progress { font-size: 12px; color: var(--ink-soft); margin-bottom: 10px; }

  .badge-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .badge-cell { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px; border-radius: 14px; background: var(--bg-soft); border: 1px solid var(--line); text-align: center; }
  .badge-cell.unlocked { background: var(--sun-soft); border-color: var(--sun); }
  .badge-cell .ic { font-size: 22px; opacity: 0.35; }
  .badge-cell.unlocked .ic { opacity: 1; }
  .badge-cell .nm { font-size: 10px; color: var(--ink-soft); line-height: 1.3; }
  .badge-cell.unlocked .nm { color: var(--ink); }

  .history-list { display: flex; flex-direction: column; gap: 0; max-height: 220px; overflow-y: auto; }
  .history-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 2px; border-bottom: 1px solid var(--line); font-size: 13px; gap: 8px; }
  .history-item:last-child { border-bottom: none; }
  .history-left { display: flex; flex-direction: column; min-width: 0; }
  .history-task { color: var(--ink); }
  .history-extra { color: var(--ink-soft); font-size: 11px; margin-top: 1px; }
  .history-date { color: var(--ink-soft); font-size: 11px; margin-top: 2px; }
  .history-pt { color: var(--sun); font-weight: 700; font-size: 13px; white-space: nowrap; }
  .empty-hist { font-size: 13px; color: var(--ink-soft); text-align: center; padding: 14px 0; }

  footer { text-align: center; margin-top: 20px; }
  footer p { font-size: 12px; color: var(--ink-soft); line-height: 1.7; margin: 0 0 12px; }

  .toast-wrap { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 50; width: calc(100% - 32px); max-width: 428px; pointer-events: none; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .toast { pointer-events: auto; background: var(--ink); color: var(--bg); border-radius: 14px; padding: 12px 18px; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 10px; box-shadow: 0 6px 20px rgba(0,0,0,0.25); animation: toast-in 0.35s cubic-bezier(.2,.9,.3,1.3) both, toast-out 0.4s ease 2.6s forwards; }
  .toast .ic { font-size: 20px; }
  .toast b { font-family: "Zen Maru Gothic", sans-serif; }
  @keyframes toast-in { from { opacity: 0; transform: translateY(-16px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes toast-out { to { opacity: 0; transform: translateY(-10px) scale(0.97); } }

  @media (max-width: 360px) {
    .streak-num { font-size: 28px; }
    .door-wrap { width: 64px; height: 80px; }
    .zukan-grid { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>
<body>
<div class="toast-wrap" id="toastWrap"></div>
<div class="app">

  <header class="top">
    <div class="brand">そと<span>ポ</span></div>
    <div class="date-label" id="dateLabel"></div>
  </header>

  <div class="hero">
    <div class="hero-top">
      <div class="door-wrap">
        <svg viewBox="0 0 100 120" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
          <rect x="10" y="8" width="60" height="104" rx="4" fill="var(--card)" stroke="var(--ink-soft)" stroke-width="2"/>
          <path d="M70 10 L92 22 L92 100 L70 112 Z" fill="var(--sun-soft)" stroke="var(--ink-soft)" stroke-width="2"/>
          <circle cx="64" cy="60" r="2.5" fill="var(--ink-soft)"/>
          <circle cx="60" cy="4" r="18" fill="var(--sun)" opacity="0.9"/>
          <path d="M60 4 L60 -8 M74 10 L84 2 M46 10 L36 2" stroke="var(--sun)" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
          <ellipse cx="76" cy="106" rx="4" ry="6" fill="var(--ink-soft)" opacity="0.35"/>
          <ellipse cx="86" cy="112" rx="4" ry="6" fill="var(--ink-soft)" opacity="0.25"/>
        </svg>
      </div>
      <div class="hero-text">
        <div class="streak-num" id="streakNum">0<small>日つづいてる</small></div>
        <div class="hero-sub" id="heroSub">今日はまだ何もしてないよ。ひとつだけ、ドアの外に出てみない?</div>
      </div>
    </div>
  </div>

  <div class="card" id="missionCard"></div>

  <div class="card">
    <h2>レベル</h2>
    <div class="level-row">
      <div class="level-name" id="levelName">げんかんタッチ</div>
      <div class="level-pt" id="levelPt">0 pt</div>
    </div>
    <div class="bar-track"><div class="bar-fill" id="levelBar" style="width:0%"></div></div>
    <div class="level-next" id="levelNext"></div>
  </div>

  <div class="card">
    <h2>この7日間</h2>
    <div class="week-strip" id="weekStrip"></div>
  </div>

  <div class="card">
    <h2>みつけたものずかん <span class="sub" id="zukanSub"></span></h2>
    <div class="zukan-progress" id="zukanProgress"></div>
    <div class="zukan-grid" id="zukanGrid"></div>
  </div>

  <div class="card">
    <h2>実績</h2>
    <div class="badge-grid" id="badgeGrid"></div>
  </div>

  <div class="card">
    <h2>やったこと</h2>
    <div class="history-list" id="historyList"></div>
  </div>

  <footer>
    <p>がんばらなくていい。できなかった日があっても、そとポは減らない。<br>いつでも、思い出したときにまた開いてね。</p>
    <button class="btn btn-ghost" id="resetBtn">記録をリセットする</button>
  </footer>

</div>

<script>
(function () {
  var STORE_KEY = 'sotopo_state_v2';

  var CHALLENGES = [
    { tier: 'light',  icon: '🚪', title: '玄関を開けて外の空気を吸う', meta: '30秒くらい', pt: 5, sec: 30 },
    { tier: 'light',  icon: '☀️', title: 'ベランダや窓際で日光を浴びる', meta: '1分くらい', pt: 5, sec: 60 },
    { tier: 'light',  icon: '🌬️', title: '外に出て深呼吸を5回する', meta: '1分くらい', pt: 6, sec: 60 },
    { tier: 'medium', icon: '📮', title: '郵便受けまで行って戻ってくる', meta: '3分くらい', pt: 9, sec: 180 },
    { tier: 'medium', icon: '🗑️', title: 'ゴミ出しのついでに空を見る', meta: '3分くらい', pt: 9, sec: 180 },
    { tier: 'medium', icon: '🚶', title: '家のまわりを1周だけ歩く', meta: '5分くらい', pt: 10, sec: 300 },
    { tier: 'active', icon: '🏪', title: '近くのコンビニまで歩いてみる', meta: '10分くらい', pt: 14, sec: 600 },
    { tier: 'active', icon: '🌳', title: '近所を好きなだけ散歩する', meta: '10分以上', pt: 15, sec: 600 },
    { tier: 'active', icon: '🧹', title: '外の掃き掃除や水やりをする', meta: '10分くらい', pt: 14, sec: 600 }
  ];

  var FIND_POOL = [
    { id: 'red',    icon: '🔴', name: '赤いもの' },
    { id: 'orange', icon: '🟠', name: 'オレンジ色のもの' },
    { id: 'yellow', icon: '🟡', name: '黄色いもの' },
    { id: 'green',  icon: '🟢', name: '緑のもの' },
    { id: 'blue',   icon: '🔵', name: '青いもの' },
    { id: 'purple', icon: '🟣', name: '紫っぽいもの' },
    { id: 'sparkle',icon: '✨', name: 'キラキラしたもの' },
    { id: 'fluffy', icon: '☁️', name: 'ふわふわしたもの' },
    { id: 'round',  icon: '⚪', name: 'まるいもの' },
    { id: 'sound',  icon: '🐦', name: '鳥や虫の声' },
    { id: 'smell',  icon: '🌿', name: 'いい匂い' },
    { id: 'nice',   icon: '💭', name: 'ちょっといいなと思うもの' }
  ];

  var MOODS = [
    { id: 'happy',  e: '😊', l: 'うれしい' },
    { id: 'calm',   e: '😌', l: 'おちついた' },
    { id: 'warm',   e: '🥰', l: 'あたたかい' },
    { id: 'surprised', e: '😲', l: 'おどろいた' },
    { id: 'plain',  e: '😐', l: 'とくになし' }
  ];

  var LEVELS = [
    { name: 'げんかんタッチ',          min: 0 },
    { name: 'いっぽ踏み出し人',         min: 20 },
    { name: 'ご近所さんぽ人',           min: 60 },
    { name: 'ちいさな冒険家',           min: 120 },
    { name: 'そとの達人',              min: 220 },
    { name: 'だいたいどこでも歩ける人', min: 360 }
  ];

  var BADGES = [
    { id: 'first_checkin', icon: '🌱', name: 'はじめの一歩', test: function (s) { return s.history.length >= 1; } },
    { id: 'streak_3',      icon: '🔥', name: '3日つづいた',   test: function (s) { return s.streak >= 3; } },
    { id: 'streak_7',      icon: '🏅', name: '1週間つづいた', test: function (s) { return s.streak >= 7; } },
    { id: 'streak_30',     icon: '🏆', name: 'ひと月つづいた', test: function (s) { return s.streak >= 30; } },
    { id: 'first_find',    icon: '🔍', name: 'はじめての発見', test: function (s) { return Object.keys(s.collection).length >= 1; } },
    { id: 'zukan_half',    icon: '🧭', name: 'ずかん半分',     test: function (s) { return Object.keys(s.collection).length >= 6; } },
    { id: 'zukan_full',    icon: '📖', name: 'ずかん制覇',     test: function (s) { return Object.keys(s.collection).length >= 12; } },
    { id: 'lvl2', icon: '⭐', name: LEVELS[1].name, test: function (s) { return s.totalPoints >= LEVELS[1].min; } },
    { id: 'lvl4', icon: '🌟', name: LEVELS[3].name, test: function (s) { return s.totalPoints >= LEVELS[3].min; } }
  ];

  function todayStr(d) { d = d || new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
  function daysBetween(a, b) { var A = new Date(a), B = new Date(b); A.setHours(0,0,0,0); B.setHours(0,0,0,0); return Math.round((B - A) / 86400000); }

  function defaultState() {
    return { totalPoints: 0, streak: 0, lastDoneDate: null, history: [], todayChoices: null, todayChoicesDate: null, collection: {}, badges: [] };
  }
  function loadState() {
    try {
      var raw = window.localStorage.getItem(STORE_KEY);
      if (!raw) return defaultState();
      var parsed = JSON.parse(raw);
      var d = defaultState();
      var merged = Object.assign(d, parsed);
      merged.collection = parsed.collection || {};
      merged.badges = parsed.badges || [];
      return merged;
    } catch (e) { return defaultState(); }
  }
  function saveState(s) {
    try { window.localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch (e) {}
  }

  var state = loadState();
  var timerHandle = null;
  var activeChallenge = null;
  var elapsedSec = 0;
  var flow = { stage: null, findPick: null, moodPick: null, basePt: 0, bonus: false };

  function showToast(icon, title, sub) {
    var wrap = document.getElementById('toastWrap');
    var el = document.createElement('div');
    el.className = 'toast';
    el.innerHTML = '<span class="ic">' + icon + '</span><span><b>' + title + '</b>' + (sub ? '　' + sub : '') + '</span>';
    wrap.appendChild(el);
    setTimeout(function () { el.remove(); }, 3100);
  }

  function checkBadges() {
    var newly = [];
    BADGES.forEach(function (b) {
      if (state.badges.indexOf(b.id) === -1 && b.test(state)) {
        state.badges.push(b.id);
        newly.push(b);
      }
    });
    newly.forEach(function (b, i) {
      setTimeout(function () { showToast(b.icon, '実績解除', b.name); }, i * 600);
    });
    return newly;
  }

  function pickTodayChoices() {
    var t = todayStr();
    if (state.todayChoicesDate === t && state.todayChoices) return state.todayChoices;
    var byTier = { light: [], medium: [], active: [] };
    CHALLENGES.forEach(function (c) { byTier[c.tier].push(c); });
    var picks = ['light', 'medium', 'active'].map(function (tier) {
      var list = byTier[tier];
      return list[Math.floor(Math.random() * list.length)];
    });
    state.todayChoices = picks;
    state.todayChoicesDate = t;
    saveState(state);
    return picks;
  }

  function pickFindOptions() {
    var unfound = FIND_POOL.filter(function (f) { return !state.collection[f.id]; });
    var pool = unfound.length >= 3 ? unfound : FIND_POOL.slice();
    var shuffled = pool.slice().sort(function () { return Math.random() - 0.5; });
    return shuffled.slice(0, 3);
  }

  function currentLevel() { var lvl = LEVELS[0]; for (var i = 0; i < LEVELS.length; i++) { if (state.totalPoints >= LEVELS[i].min) lvl = LEVELS[i]; } return lvl; }
  function levelIndexForPoints(pt) { var idx = 0; for (var i = 0; i < LEVELS.length; i++) { if (pt >= LEVELS[i].min) idx = i; } return idx; }
  function nextLevel() { var cur = currentLevel(); var idx = LEVELS.indexOf(cur); return LEVELS[idx + 1] || null; }

  function renderHero() {
    document.getElementById('dateLabel').textContent = new Date().toLocaleDateString('ja-JP', { month: 'long', day: 'numeric', weekday: 'short' });
    var t = todayStr();
    var doneToday = state.lastDoneDate === t;
    document.getElementById('streakNum').innerHTML = state.streak + '<small>日つづいてる</small>';
    var sub = document.getElementById('heroSub');
    if (doneToday) sub.textContent = '今日はもうやった。えらい。明日もまた、ここに来てね。';
    else if (state.streak > 0) sub.textContent = 'つづいてるね。今日もひとつ、外に出てみない?';
    else sub.textContent = '今日はまだ何もしてないよ。ひとつだけ、ドアの外に出てみない?';
  }

  function renderLevel() {
    var lvl = currentLevel(); var next = nextLevel();
    document.getElementById('levelName').textContent = lvl.name;
    document.getElementById('levelPt').textContent = state.totalPoints + ' pt';
    var pct, nextText;
    if (next) {
      var span = next.min - lvl.min; var into = state.totalPoints - lvl.min;
      pct = Math.max(4, Math.min(100, Math.round((into / span) * 100)));
      nextText = 'あと ' + (next.min - state.totalPoints) + 'pt で「' + next.name + '」';
    } else { pct = 100; nextText = '一番上のレベルだよ'; }
    document.getElementById('levelBar').style.width = pct + '%';
    document.getElementById('levelNext').textContent = nextText;
  }

  function renderWeek() {
    var strip = document.getElementById('weekStrip'); strip.innerHTML = '';
    var doneDates = {}; state.history.forEach(function (h) { doneDates[h.dateKey] = true; });
    var todayD = new Date();
    for (var i = 6; i >= 0; i--) {
      var d = new Date(todayD); d.setDate(d.getDate() - i);
      var key = todayStr(d); var isToday = i === 0; var on = !!doneDates[key];
      var el = document.createElement('div');
      el.className = 'week-day' + (isToday ? ' today' : '');
      el.innerHTML = '<div class="dot' + (on ? ' on' : '') + '">' + (on ? '🌤️' : '') + '</div><div class="lbl">' + ['日','月','火','水','木','金','土'][d.getDay()] + '</div>';
      strip.appendChild(el);
    }
  }

  function renderZukan() {
    var grid = document.getElementById('zukanGrid'); grid.innerHTML = '';
    var foundCount = Object.keys(state.collection).length;
    document.getElementById('zukanProgress').textContent = foundCount + ' / ' + FIND_POOL.length + ' みつけた';
    FIND_POOL.forEach(function (f) {
      var filled = !!state.collection[f.id];
      var cell = document.createElement('div');
      cell.className = 'zukan-cell' + (filled ? ' filled' : '');
      cell.innerHTML = '<div class="ic">' + f.icon + '</div><div class="nm">' + (filled ? f.name : '？') + '</div>';
      grid.appendChild(cell);
    });
  }

  function renderBadges() {
    var grid = document.getElementById('badgeGrid'); grid.innerHTML = '';
    BADGES.forEach(function (b) {
      var unlocked = state.badges.indexOf(b.id) !== -1;
      var cell = document.createElement('div');
      cell.className = 'badge-cell' + (unlocked ? ' unlocked' : '');
      cell.innerHTML = '<div class="ic">' + b.icon + '</div><div class="nm">' + (unlocked ? b.name : '？？？') + '</div>';
      grid.appendChild(cell);
    });
  }

  function renderHistory() {
    var list = document.getElementById('historyList'); list.innerHTML = '';
    if (!state.history.length) { list.innerHTML = '<div class="empty-hist">まだ記録がないよ。最初の一歩を待ってる。</div>'; return; }
    state.history.slice().reverse().slice(0, 20).forEach(function (h) {
      var row = document.createElement('div'); row.className = 'history-item';
      var extra = '';
      if (h.find) extra += h.find.icon + ' ' + h.find.name;
      if (h.mood) extra += (extra ? '　' : '') + h.mood.e + ' ' + h.mood.l;
      row.innerHTML =
        '<div class="history-left"><div class="history-task">' + h.icon + '  ' + h.title + '</div>' +
        (extra ? '<div class="history-extra">' + extra + '</div>' : '') +
        '<div class="history-date">' + h.label + '</div></div>' +
        '<div class="history-pt">+' + h.pt + 'pt</div>';
      list.appendChild(row);
    });
  }

  function renderMission() {
    var card = document.getElementById('missionCard');
    var t = todayStr();
    var doneToday = state.lastDoneDate === t;

    if (flow.stage === 'in_progress') { renderInProgress(card); return; }
    if (flow.stage === 'find') { renderFindStep(card); return; }
    if (flow.stage === 'mood') { renderMoodStep(card); return; }
    if (flow.stage === 'summary') { renderSummary(card); return; }

    if (doneToday) {
      card.innerHTML =
        '<div class="done-state"><div class="big">✅</div><h3>今日の一歩、できたね</h3>' +
        '<p>もう十分。でも、もう少し外にいたい気分なら、<br>もうひとつやってボーナスをもらうこともできるよ。</p>' +
        '<button class="btn btn-primary" id="bonusBtn">もうひとつやる（ボーナス+3pt）</button></div>';
      document.getElementById('bonusBtn').onclick = function () { showChoices(card, true); };
      return;
    }
    showChoices(card, false);
  }

  function showChoices(card, bonus) {
    var choices = pickTodayChoices();
    var html = '<h2>' + (bonus ? '追加でやってみる?' : '今日のミッションを選ぶ') + '</h2><div class="choice-list">';
    choices.forEach(function (c, idx) {
      html += '<button class="choice" data-idx="' + idx + '"><div class="choice-icon">' + c.icon + '</div>' +
        '<div class="choice-body"><div class="choice-title">' + c.title + '</div><div class="choice-meta">' + c.meta + '</div></div>' +
        '<div class="choice-pt">+' + (bonus ? 3 : c.pt) + 'pt</div></button>';
    });
    html += '</div>';
    card.innerHTML = html;
    Array.prototype.forEach.call(card.querySelectorAll('.choice'), function (btn) {
      btn.onclick = function () {
        var idx = parseInt(btn.getAttribute('data-idx'), 10);
        startChallenge(choices[idx], bonus);
      };
    });
  }

  function startChallenge(challenge, bonus) {
    activeChallenge = challenge;
    flow = { stage: 'in_progress', findPick: null, moodPick: null, basePt: bonus ? 3 : challenge.pt, bonus: !!bonus };
    elapsedSec = 0;
    renderMission();
    timerHandle = setInterval(function () { elapsedSec += 1; updateTimerRing(); }, 1000);
  }

  function updateTimerRing() {
    var ring = document.getElementById('timerRing');
    if (!ring || !activeChallenge) return;
    var pct = Math.min(100, Math.round((elapsedSec / activeChallenge.sec) * 100));
    ring.style.setProperty('--pct', pct);
    var mm = Math.floor(elapsedSec / 60); var ss = elapsedSec % 60;
    document.getElementById('timerT').textContent = mm + ':' + (ss < 10 ? '0' : '') + ss;
  }

  function renderInProgress(card) {
    var c = activeChallenge;
    card.innerHTML =
      '<div class="in-progress"><h2 style="margin-bottom:2px;">' + c.icon + '  ' + c.title + '</h2>' +
      '<div class="timer-ring" id="timerRing" style="--pct:0;"><div class="timer-inner"><div class="t" id="timerT">0:00</div><div class="u">経過</div></div></div>' +
      '<p>目安は ' + c.meta + '。急がなくていいよ。<br>もどってきたら、下のボタンを押してね。</p>' +
      '<button class="btn btn-coral" id="finishBtn">できた!</button><br><br>' +
      '<button class="btn btn-ghost" id="cancelBtn">やめる</button></div>';
    updateTimerRing();
    document.getElementById('finishBtn').onclick = function () { clearInterval(timerHandle); flow.stage = 'find'; renderMission(); };
    document.getElementById('cancelBtn').onclick = cancelChallenge;
  }

  function cancelChallenge() {
    clearInterval(timerHandle); timerHandle = null; activeChallenge = null;
    flow = { stage: null, findPick: null, moodPick: null, basePt: 0, bonus: false };
    renderAll();
  }

  function renderFindStep(card) {
    var opts = pickFindOptions();
    var html = '<h2>ついでに何か見つけた?</h2>' +
      '<div class="find-grid">';
    opts.forEach(function (f, idx) {
      var already = !!state.collection[f.id];
      html += '<button class="find-opt' + (already ? ' found-before' : '') + '" data-idx="' + idx + '">' +
        '<span class="ic">' + f.icon + '</span><span>' + f.name + '</span>' +
        (already ? '<span class="tag">見つけたことある</span>' : '<span class="tag">+4pt</span>') + '</button>';
    });
    html += '</div><button class="btn-text" id="skipFind">特になかった／スキップ</button>';
    card.innerHTML = html;
    Array.prototype.forEach.call(card.querySelectorAll('.find-opt'), function (btn) {
      btn.onclick = function () {
        var idx = parseInt(btn.getAttribute('data-idx'), 10);
        flow.findPick = opts[idx];
        flow.stage = 'mood';
        renderMission();
      };
    });
    document.getElementById('skipFind').onclick = function () { flow.stage = 'mood'; renderMission(); };
  }

  function renderMoodStep(card) {
    var html = '<h2>今の気持ちは?</h2><div class="mood-row">';
    MOODS.forEach(function (m, idx) {
      html += '<button class="mood-opt" data-idx="' + idx + '"><span class="e">' + m.e + '</span><span class="l">' + m.l + '</span></button>';
    });
    html += '</div><button class="btn-text" id="skipMood">スキップ</button>';
    card.innerHTML = html;
    Array.prototype.forEach.call(card.querySelectorAll('.mood-opt'), function (btn) {
      btn.onclick = function () {
        var idx = parseInt(btn.getAttribute('data-idx'), 10);
        flow.moodPick = MOODS[idx];
        finalizeChallenge();
      };
    });
    document.getElementById('skipMood').onclick = function () { finalizeChallenge(); };
  }

  function finalizeChallenge() {
    var c = activeChallenge;
    var t = todayStr();
    var wasDoneToday = state.lastDoneDate === t;
    var prevLevelIdx = levelIndexForPoints(state.totalPoints);

    var pt = flow.basePt;
    var isNewFind = false;
    if (flow.findPick) {
      if (!state.collection[flow.findPick.id]) { isNewFind = true; state.collection[flow.findPick.id] = true; pt += 4; }
      else { pt += 1; }
    }

    state.totalPoints += pt;
    state.history.push({
      dateKey: t,
      label: new Date().toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric' }) + ' ' + new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' }),
      title: c.title, icon: c.icon, pt: pt,
      find: flow.findPick || null, mood: flow.moodPick || null
    });

    if (!wasDoneToday) {
      if (state.lastDoneDate && daysBetween(state.lastDoneDate, t) === 1) state.streak += 1;
      else state.streak = 1;
      state.lastDoneDate = t;
    }

    saveState(state);
    var newLevelIdx = levelIndexForPoints(state.totalPoints);
    var leveledUp = newLevelIdx > prevLevelIdx;

    var newBadges = checkBadges();
    saveState(state);

    flow.stage = 'summary';
    flow._resultPt = pt;
    flow._resultFind = flow.findPick;
    flow._resultMood = flow.moodPick;
    flow._leveledUp = leveledUp;
    flow._newLevelName = leveledUp ? LEVELS[newLevelIdx].name : null;
    flow._isNewFind = isNewFind;

    timerHandle = null; activeChallenge = null;
    renderAll();

    if (leveledUp) {
      setTimeout(function () { showToast('⬆️', 'レベルアップ', LEVELS[newLevelIdx].name); }, newBadges.length * 600 + 300);
    }
  }

  function renderSummary(card) {
    var chips = '<div class="pt-chip">基本 <b>+' + (flow.basePt) + 'pt</b></div>';
    if (flow._resultFind) {
      chips += '<div class="pt-chip">' + flow._resultFind.icon + ' 発見 <b>+' + (flow._isNewFind ? 4 : 1) + 'pt</b></div>';
    }
    var headline = flow._leveledUp ? 'レベルアップした!' : 'できた、えらい';
    var sub = '';
    if (flow._resultFind) sub += flow._resultFind.icon + ' 「' + flow._resultFind.name + '」を見つけた。' + (flow._isNewFind ? 'ずかんに追加されたよ。' : '');
    if (flow._resultMood) sub += (sub ? '<br>' : '') + 'そのときの気持ち：' + flow._resultMood.e + ' ' + flow._resultMood.l;
    card.innerHTML =
      '<div class="done-state"><div class="big">' + (flow._leveledUp ? '🎉' : '✅') + '</div>' +
      '<h3>' + headline + '</h3>' +
      '<div class="pt-breakdown">' + chips + '</div>' +
      (sub ? '<p>' + sub + '</p>' : '<p>今日の分、ちゃんと積み重なったよ。</p>') +
      '<button class="btn btn-primary" id="closeSummary">とじる</button></div>';
    document.getElementById('closeSummary').onclick = function () {
      flow = { stage: null, findPick: null, moodPick: null, basePt: 0, bonus: false };
      renderMission();
    };
  }

  function renderAll() { renderHero(); renderMission(); renderLevel(); renderWeek(); renderZukan(); renderBadges(); renderHistory(); }

  document.getElementById('resetBtn').onclick = function () {
    if (window.confirm('記録を全部消すよ。本当にいい?')) {
      state = defaultState(); flow = { stage: null, findPick: null, moodPick: null, basePt: 0, bonus: false };
      saveState(state); renderAll();
    }
  };

  renderAll();
})();
</script>
</body>
</html>
